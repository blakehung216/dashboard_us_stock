function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1) - day; // 週一為每週開始
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function getPeriodRange(period, anchor) {
  const d = new Date(anchor);
  if (period === "day") {
    const start = new Date(d); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(end.getDate() + 1);
    return [start, end, start.toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'})];
  } else if (period === "week") {
    const start = startOfWeek(d);
    const end = new Date(start); end.setDate(end.getDate() + 7);
    const endDisp = new Date(end); endDisp.setDate(endDisp.getDate() - 1);
    return [start, end, `${start.toLocaleDateString('zh-TW')} ~ ${endDisp.toLocaleDateString('zh-TW')}`];
  } else if (period === "month") {
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return [start, end, `${d.getFullYear()}年${d.getMonth()+1}月`];
  } else { // quarter
    const q = Math.floor(d.getMonth() / 3);
    const start = new Date(d.getFullYear(), q * 3, 1);
    const end = new Date(d.getFullYear(), q * 3 + 3, 1);
    return [start, end, `${d.getFullYear()}年 Q${q+1}`];
  }
}

function shiftAnchor(period, anchor, dir) {
  const d = new Date(anchor);
  if (period === "day") d.setDate(d.getDate() + dir);
  else if (period === "week") d.setDate(d.getDate() + dir * 7);
  else if (period === "month") d.setMonth(d.getMonth() + dir);
  else d.setMonth(d.getMonth() + dir * 3);
  return d;
}

function stanceBadge(stance) {
  return `<span class="badge ${stance}">${stance}</span>`;
}

function render() {
  const [start, end, label] = getPeriodRange(currentPeriod, anchorDate);
  document.getElementById('periodLabel').textContent = label;

  const postsInRange = ALL_POSTS.filter(p => {
    const t = new Date(p.date);
    return t >= start && t < end;
  });

  // 這個期間裡，每支股票最新的立場（用來排卡片）
  const tickerMap = {};
  postsInRange.forEach(p => {
    (p.mentions || []).forEach(m => {
      if (!tickerMap[m.ticker]) tickerMap[m.ticker] = { name: m.name, latestStance: m.stance, latestReason: m.reason, count: 0 };
      tickerMap[m.ticker].count += 1;
    });
  });

  const summaryBar = document.getElementById('summaryBar');
  const bullCount = postsInRange.reduce((n,p) => n + (p.mentions||[]).filter(m=>m.stance==='多頭').length, 0);
  const bearCount = postsInRange.reduce((n,p) => n + (p.mentions||[]).filter(m=>m.stance==='空頭').length, 0);
  const neutralCount = postsInRange.reduce((n,p) => n + (p.mentions||[]).filter(m=>m.stance==='中立').length, 0);
  summaryBar.innerHTML = `<span>📝 貼文 ${postsInRange.length} 則</span><span>${stanceBadge('多頭')} ${bullCount}</span><span>${stanceBadge('空頭')} ${bearCount}</span><span>${stanceBadge('中立')} ${neutralCount}</span>`;

  const grid = document.getElementById('tickerGrid');
  const emptyState = document.getElementById('emptyState');
  const tickers = Object.keys(tickerMap);
  if (tickers.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    grid.innerHTML = tickers.map(t => {
      const info = tickerMap[t];
      return `<div class="ticker-card" onclick="openHistory('${t}')">
        <div class="tname">${info.name} <span style="color:#aaa;font-weight:400;">${t}</span></div>
        <div class="tsub">這個期間提及 ${info.count} 次　${stanceBadge(info.latestStance)}</div>
        <div class="treason">${info.latestReason || ''}</div>
      </div>`;
    }).join('');
  }

  const postList = document.getElementById('postList');
  if (postsInRange.length === 0) {
    postList.innerHTML = '<div style="color:#aaa;font-size:13px;">（無）</div>';
  } else {
    postList.innerHTML = postsInRange.map(p => {
      const mentionsHtml = (p.mentions || []).map(m => `${stanceBadge(m.stance)} <span style="font-size:12px;color:#555;">${m.name}(${m.ticker})</span>`).join(' ');
      return `<div class="post-item">
        <div class="pdate">${new Date(p.date).toLocaleString('zh-TW')}　<a href="${p.url}" target="_blank">查看原文 ↗</a></div>
        <div class="ptext">${p.text_summary || ''}</div>
        <div class="pmentions">${mentionsHtml}</div>
      </div>`;
    }).join('');
  }
}

function openHistory(ticker) {
  const info = TICKER_HISTORY[ticker];
  if (!info) return;
  document.getElementById('modalTitle').textContent = `${info.name} (${ticker}) 觀點歷史紀錄`;
  document.getElementById('modalBody').innerHTML = info.entries.map(e => `
    <div class="history-entry">
      <div class="hdate">${new Date(e.date).toLocaleString('zh-TW')}　${stanceBadge(e.stance)}</div>
      <div class="hreason">${e.reason || ''}</div>
      <a href="${e.url}" target="_blank">查看原文 ↗</a>
    </div>
  `).join('');
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('modalClose').onclick = () => document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') e.currentTarget.classList.remove('open'); };

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    render();
  };
});

document.getElementById('prevBtn').onclick = () => { anchorDate = shiftAnchor(currentPeriod, anchorDate, -1); render(); };
document.getElementById('nextBtn').onclick = () => { anchorDate = shiftAnchor(currentPeriod, anchorDate, 1); render(); };
document.getElementById('todayBtn').onclick = () => { anchorDate = ALL_POSTS.length > 0 ? new Date(ALL_POSTS[0].date) : new Date(); render(); };

render();
</script>
</body>
</html>

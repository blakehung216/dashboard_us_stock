<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>股票監測器 Dashboard</title>
<style>
  :root {
    --green: #0a7a2f;
    --red: #c0392b;
    --border: #ddd;
    --bg-soft: #f5f5f5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    margin: 0;
    padding: 0;
    background: #fafafa;
    color: #222;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 16px 24px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #aaa; }

  .market-tabs {
    display: flex;
    gap: 8px;
    padding: 12px 24px 0;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .market-tab {
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    background: none;
    font-size: 15px;
    font-weight: 600;
    color: #888;
    border-bottom: 3px solid transparent;
  }
  .market-tab.active { color: #1a1a2e; border-bottom-color: #1a1a2e; }

  .layout { display: flex; min-height: calc(100vh - 120px); }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 120px);
  }
  .date-group { border-bottom: 1px solid #eee; }
  .date-label {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    background: var(--bg-soft);
  }
  .session-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
    color: #333;
  }
  .session-btn:hover { background: #f0f4fa; }
  .session-btn.active { background: #e3ecfa; font-weight: 600; color: #1a1a2e; }

  .main { flex: 1; padding: 20px 28px; overflow-x: auto; }
  .entry-header { font-size: 18px; font-weight: 700; margin-bottom: 12px; }

  .box {
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .box-dropout { background: #fdeaea; border: 1px solid #e79a9a; }
  .box-streak { background: #fff8e1; border: 1px solid #f0d878; }
  .box-hitrate { background: #eef4fb; border: 1px solid #b8d1ea; }
  .box strong.title { font-size: 14px; display: block; margin-bottom: 6px; }
  .box ul { margin: 4px 0 0; padding-left: 18px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
  th { text-align: left; padding: 8px; border-bottom: 2px solid #333; background: var(--bg-soft); }
  td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.center { text-align: center; white-space: nowrap; }
  .score-pos { color: var(--green); font-weight: bold; }
  .score-neg { color: var(--red); font-weight: bold; }
  .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 8px; }
  .empty { color: #888; padding: 40px; text-align: center; }
  .reason { font-size: 12px; color: #555; }
</style>
</head>

const SESSION_LABELS = {"premarket": "盤前", "midday": "盤中", "afterclose": "盤後"};

let currentMarket = "tw";
let currentEntryId = null;

function fmtScore(score) {
  const cls = score > 0 ? "score-pos" : (score < 0 ? "score-neg" : "");
  const sign = score > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${score}</span>`;
}

function renderSidebar() {
  const entries = DATA[currentMarket] || [];
  const sidebar = document.getElementById("sidebar");
  if (entries.length === 0) {
    sidebar.innerHTML = '<div class="empty">尚無歷史資料</div>';
    return;
  }
  // group by date, most recent first
  const byDate = {};
  entries.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });
  const dates = Object.keys(byDate).sort().reverse();
  let html = "";
  dates.forEach(d => {
    html += `<div class="date-group"><div class="date-label">${d}</div>`;
    byDate[d].sort((a, b) => a.session.localeCompare(b.session)).forEach(e => {
      const label = SESSION_LABELS[e.session] || e.session;
      html += `<button class="session-btn" data-id="${e.id}">${label}</button>`;
    });
    html += `</div>`;
  });
  sidebar.innerHTML = html;

  sidebar.querySelectorAll(".session-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectEntry(btn.dataset.id);
    });
  });
}

function buildTable(stocks) {
  if (!stocks || stocks.length === 0) return '<div class="empty">無資料</div>';
  let rows = stocks.map((s, i) => {
    const reason = `基本面：${s.fundamental_note || ""}<br>技術面：${s.technical_note || ""}<br>量價四大買賣點：${s.four_signals_note || ""}<br>消息面：${s.news_note || ""}`;
    return `<tr>
<td class="center">${i + 1}</td>
<td><strong>${s.name}</strong><br><span style="color:#888;font-size:12px;">${s.symbol}</span></td>
<td class="center">${s.current_price ?? "—"}</td>
<td class="center">${fmtScore(s.composite_score)}</td>
<td class="center">${s.rank_change || "—"}</td>
<td class="center">${s.track_record || "尚無歷史紀錄"}</td>
<td class="reason">${reason}</td>
</tr>`;
  }).join("");
  return `<table>
<thead><tr><th>排名</th><th>股票</th><th>股價</th><th>綜合分數</th><th>排名變化</th><th>歷史命中率</th><th>評分理由</th></tr></thead>
<tbody>${rows}</tbody>
</table>`;
}

function hitRateLine(label, stats) {
  if (!stats || !stats.n) return `${label}：尚無足夠已驗證的歷史預測`;
  return `${label}：已驗證 ${stats.n} 筆 ｜ 絕對方向命中率 ${stats.simple_rate}% ｜ 相對大盤命中率 ${stats.alpha_rate}%`;
}

function renderMain(entry) {
  const main = document.getElementById("main");
  if (!entry) {
    main.innerHTML = '<div class="empty">請從左側選擇日期/場次</div>';
    return;
  }
  const label = SESSION_LABELS[entry.session] || entry.session;
  let html = `<div class="entry-header">${entry.date}　${label}</div>`;

  if (entry.top10_dropouts && entry.top10_dropouts.length) {
    const items = entry.top10_dropouts.map(s => `<li><strong>${s.name}</strong>（${s.symbol}）原本已連續 <strong>${s.streak_before_dropout}</strong> 天穩居看漲榜前十名，今日已跌出前十名</li>`).join("");
    html += `<div class="box box-dropout"><strong class="title">⚠️ 長期穩居前十名，今日突然跌出</strong><ul>${items}</ul></div>`;
  }
  if (entry.long_streak_top5 && entry.long_streak_top5.length) {
    const items = entry.long_streak_top5.map(s => `<li><strong>${s.name}</strong>（${s.symbol}）已連續 <strong>${s.streak}</strong> 天穩居看漲榜前五名</li>`).join("");
    html += `<div class="box box-streak"><strong class="title">🔥 連續5天以上穩居前五名</strong><ul>${items}</ul></div>`;
  }
  if (entry.hit_rate_summary && entry.hit_rate_summary.overall && entry.hit_rate_summary.overall.n) {
    const lines = [
      hitRateLine("整體", entry.hit_rate_summary.overall),
      hitRateLine("看漲榜", entry.hit_rate_summary.bullish),
      hitRateLine("看跌榜", entry.hit_rate_summary.bearish),
    ].join("<br>");
    html += `<div class="box box-hitrate"><strong class="title">📊 命中率追蹤（累計至今）</strong>${lines}</div>`;
  }

  html += '<div class="section-title">🔼 最有機會續漲的10檔</div>';
  html += buildTable(entry.bullish);
  html += '<div class="section-title">🔽 最需要留意下跌風險的10檔</div>';
  html += buildTable(entry.bearish);

  main.innerHTML = html;
}

function selectEntry(id) {
  currentEntryId = id;
  const entries = DATA[currentMarket] || [];
  const entry = entries.find(e => e.id === id);
  document.querySelectorAll(".session-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  renderMain(entry);
}

function switchMarket(market) {
  currentMarket = market;
  document.querySelectorAll(".market-tab").forEach(t => t.classList.toggle("active", t.dataset.market === market));
  renderSidebar();
  const entries = DATA[currentMarket] || [];
  if (entries.length > 0) {
    const latest = [...entries].sort((a, b) => (a.date + a.session).localeCompare(b.date + b.session)).pop();
    selectEntry(latest.id);
  } else {
    renderMain(null);
  }
}

document.querySelectorAll(".market-tab").forEach(tab => {
  tab.addEventListener("click", () => switchMarket(tab.dataset.market));
});

switchMarket("tw");
